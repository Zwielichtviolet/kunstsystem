<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunstsystem — улучшенная версия (демо)</title>
<style>
* { box-sizing: border-box; }
body {
    background-color: #050505;
    color: #d1d1d1;
    font-family: 'Courier New', Courier, monospace;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}
body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.18) 3px);
    z-index: 999;
}
.terminal {
    max-width: 900px;
    width: 100%;
    background-color: rgba(15,15,15,0.95);
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(0,255,0,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.terminal-header {
    background-color: #1a1a1a;
    padding: 10px 15px;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
}
.dots { display: flex; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red { background-color: #ff5f56; }
.dot.yellow { background-color: #ffbd2e; }
.dot.green { background-color: #27c93f; }
.title { margin-left: 20px; color: #666; font-size: 0.85rem; letter-spacing: 1px; }
.terminal-body { padding: 30px 40px; flex-grow: 1; overflow-x: hidden; }
.command-line { color: #aaa; margin: 15px 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.prompt { color: #ffbd2e; white-space: nowrap; }
.cmd-input {
    background: transparent; border: none; outline: none; color: #27c93f;
    font-family: inherit; font-size: 1rem; width: 100%; caret-color: #27c93f;
    padding: 2px 0; border-bottom: 1px dashed transparent; transition: border-color 0.2s ease;
}
.cmd-input:focus { border-bottom-color: rgba(39,201,63,0.4); }
.cmd-input::placeholder { color: #444; }
.cmd-output { color: #27c93f; font-size: 0.95rem; margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
.cmd-output.cmd-echo { color: #aaa; }
.cmd-output.cmd-error { color: #ff5f56; }
.cmd-output.cmd-muted { color: #666; font-style: italic; }
.term-dual { display: grid; margin-bottom: 10px; width: 100%; }
.term-dual > span { grid-area: 1 / 1; }
.term-dual .lang-de {
    color: #800000; transform: translate(7px, 9px); user-select: none; z-index: 1; white-space: nowrap;
}
.term-dual .lang-ru { color: #e0e0e0; z-index: 2; white-space: nowrap; }
.term-dual.title-dual { margin-top: 20px; margin-bottom: 10px; }
.term-dual.title-dual .lang-de, .term-dual.title-dual .lang-ru { font-size: 2.4rem; font-weight: bold; letter-spacing: 2px; }
.term-dual.title-dual .lang-ru { text-shadow: 0 0 12px rgba(39,201,63,0.15); }
.term-dual.title-dual .lang-de { transform: translate(9px, 9px); }
.term-dual.desc-dual .lang-ru { font-size: 1.1rem; color: #aaa; }
.term-dual.green-command { margin-top: 20px; }
.term-dual.green-command .lang-ru { color: #27c93f; font-size: 1rem; }
.term-dual.status-dual .lang-ru { font-size: 0.9rem; color: #27c93f; font-style: italic; }
.style-list { list-style: none; padding: 0; margin: 20px 0; }
.style-list li { margin-bottom: 15px; }
a.term-dual.list-item { text-decoration: none; font-size: 1.2rem; transition: all 0.2s ease; cursor: pointer; }
a.term-dual.list-item:hover .lang-ru { color: #ffbd2e; text-shadow: 0 0 10px rgba(255,189,46,0.4); }
a.term-dual.list-item:hover .lang-de { color: #666; }
a:focus-visible, .cmd-input:focus-visible { outline: 1px dashed #ffbd2e; outline-offset: 3px; }
.simple-link {
    display: inline-block; color: #ffbd2e; text-decoration: none; font-size: 1rem;
    margin-bottom: 20px; transition: all 0.2s ease; cursor: pointer;
}
.simple-link:hover { text-shadow: 0 0 8px rgba(255,189,46,0.6); color: #fff; }
.text-block {
    line-height: 1.6; color: #b0b0b0; border-left: 2px solid #27c93f;
    border-radius: 0 4px 4px 0; padding: 15px; margin-bottom: 30px;
    background-color: rgba(39,201,63,0.03);
}
.image-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
.image-card {
    background: #0a0a0a; border: 1px solid #333; width: calc(50% - 10px);
    border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;
}
.art-image {
    width: 100%; height: 250px; object-fit: cover; display: block;
    border-bottom: 1px solid #222; transition: transform 0.3s ease, filter 0.3s ease;
    filter: grayscale(25%) contrast(1.1) sepia(12%);
}
.image-card:hover .art-image { transform: scale(1.03); filter: none; }
.img-placeholder {
    width: 100%; height: 250px; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; color: #27c93f;
    background: repeating-linear-gradient(45deg, #0a0a0a 0px, #0a0a0a 12px, #0d120d 12px, #0d120d 24px);
    border-bottom: 1px solid #222; font-size: 0.85rem; text-align: center; padding: 10px;
}
.image-caption {
    color: #aaa; font-size: 0.85rem; padding: 15px 10px; text-align: center;
    background: #0a0a0a; line-height: 1.4; flex-grow: 1;
    display: flex; align-items: center; justify-content: center;
}
.reveal { animation: fadeUp 0.45s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; }
    .art-image, a.term-dual.list-item, .simple-link { transition: none; }
}
@media (max-width: 600px) {
    body { padding: 16px 10px; }
    .terminal-body { padding: 20px; }
    .term-dual.title-dual .lang-de, .term-dual.title-dual .lang-ru { font-size: 1.6rem; }
    .term-dual .lang-de { transform: translate(2px, 2px); }
    .image-card { width: 100%; }
    .art-image, .img-placeholder { height: 200px; }
}
</style>
</head>

            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>

<script>
var DATA = [{"slug":"impressionismus","de":"IMPRESSIONISMUS","ru":"ИМПРЕССИОНИЗМ","tb":"<p>Стиль в искусстве, зародившийся во Франции в конце XIX века. Импрессионизм — это про мимолётное впечатление: свет, воздух, движение, изменчивость момента. Художники не стремятся к фотографической точности, а передают ощущение от сцены.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Работа со светом.</strong> Свет становится главным героем: он дрожит на воде, ложится пятнами на траву, играет в отражениях.</li> <li><strong>Цвет вместо чёрного.</strong> Тени не чёрные, а цветные — синие, фиолетовые, зелёные, потому что тень тоже отражает окружающий мир.</li> <li><strong>Видимые мазки.</strong> Кисть оставляет заметные, лёгкие, иногда раздельные мазки, из которых складывается образ на расстоянии.</li> <li><strong>Бытовые сюжеты.</strong> Прогулки, кафе, сады, реки, городские улицы — всё, что происходит здесь и сейчас.</li> </ul> <p><em>Примеры настроений: «лёгкое утро на набережной», «солнечный свет сквозь листву», «город после дождя, когда всё блестит».</em></p>","artists":["Клод Моне (Claude Monet)","Пьер Огюст Ренуар (Pierre-Auguste Renoir)","Эдгар Дега (Edgar Degas)"],"works":[{"src":"Monet.jpg","alt":"Впечатление. Восходящее солнце","caption":"Monet - Impression, soleil levant"},{"src":"renoir.jpg","alt":"Ренуар","caption":"Renoir - Bal du moulin de la Galette"}]},{"slug":"kubismus","de":"KUBISMUS","ru":"КУБИЗМ","tb":"<p>Авангардное направление в изобразительном искусстве начала XX века. Кубизм — это попытка показать предмет сразу с разных точек зрения, разобрать его на части и собрать заново. Это не про «красиво», а про структуру и геометрию.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Геометризация форм.</strong> Предметы превращаются в кубы, конусы, цилиндры, плоскости.</li> <li><strong>Множественные ракурсы.</strong> Один объект как будто виден одновременно сбоку, сверху, спереди — будто ты ходишь вокруг него и собираешь все взгляды в одном кадре.</li> <li><strong>Сдержанная палитра.</strong> Часто используют приглушённые, землистые тона, чтобы не отвлекаться от формы.</li> <li><strong>Коллаж и фактура.</strong> В кубистские работы часто добавляют газетные вырезки, обои, песок, чтобы усилить ощущение «сборки» из разных материалов.</li> </ul> <p><em>Примеры настроений: «холодная логика структуры», «город как набор граней», «предмет, увиденный в движении».</em></p>","artists":["Пабло Пикассо (Pablo Picasso)","Жорж Брак (Georges Braque)","Хуан Грис (Juan Gris)"],"works":[{"src":"Pablo.jpg","alt":"Авиньонские девицы","caption":"Picasso - Les Demoiselles d'Avignon"},{"src":"Braque.jpeg","alt":"Дома в Эстаке","caption":"Braque - Maisons à l'Estaque"}]},{"slug":"surrealismus","de":"SURREALISMUS","ru":"СЮРРЕАЛИЗМ","tb":"<p>Направление в искусстве, сформировавшееся к началу 1920-х годов во Франции. Сюрреализм — это мир сна, парадокса и неожиданных сочетаний. Он берёт реальные вещи и ставит их в невозможные отношения, чтобы пробудить воображение.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Парадоксальные комбинации.</strong> Часы стекают с ветки, человек с рыбьим хвостом идёт по пустыне — логика здесь не бытовая, а сновидческая.</li> <li><strong>Гиперреалистичная техника.</strong> Детали прорисованы очень точно, чтобы абсурд выглядел убедительно.</li> <li><strong>Искажение масштаба и перспективы.</strong> Маленькое становится огромным, близкое — далёким, пространство «плывёт».</li> <li><strong>Символизм и намёки.</strong> Часто в работах есть скрытые смыслы, личные коды, архетипы.</li> </ul> <p><em>Примеры настроений: «сон, который помнишь утром», «тишина перед загадкой», «мир, где правила не работают».</em></p>","artists":["Сальвадор Дали (Salvador Dalí)","Рене Магритт (René Magritte)","Макс Эрнст (Max Ernst)"],"works":[{"src":"Memory.jpg","alt":"Постоянство памяти","caption":"Dalí - Постоянство памяти"},{"src":"TheSonOfMan.jpg","alt":"Сын человеческий","caption":"Magritte - Сын человеческий"}]},{"slug":"expressionismus","de":"EXPRESSIONISMUS","ru":"ЭКСПРЕССИОНИЗМ","tb":"<p>Течение в европейском искусстве эпохи модернизма, наибольшее развитие получившее в первые десятилетия XX века. Экспрессионизм ставит во главу угла внутреннее состояние: страх, одиночество, восторг, отчаяние. Форма и цвет служат эмоциям, а не точности.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Яркие, контрастные цвета.</strong> Цвет передаёт чувство: красный — напряжение, синий — холод и отчуждение, жёлтый — тревогу.</li> <li><strong>Деформация форм.</strong> Фигуры могут быть вытянутыми, угловатыми, искажёнными, чтобы подчеркнуть внутреннее напряжение.</li> <li><strong>Резкие контуры и мазки.</strong> Линии острые, энергичные, мазки густые и быстрые.</li> <li><strong>Тяжёлые темы.</strong> Одиночество, толпа, война, страх, отчуждение — экспрессионисты не боятся показывать «тёмные» стороны.</li> </ul> <p><em>Примеры настроений: «город давит на плечи», «тишина, звенящая от напряжения», «внутренний крик».</em></p>","artists":["Эдвард Мунк (Edvard Munch)","Эрнст Людвиг Кирхнер (Ernst Ludwig Kirchner)","Василий Кандинский (Wassily Kandinsky)"],"works":[{"src":"Scream.jpg","alt":"Крик","caption":"Munch - Крик"},{"src":"Berlin.jpg","alt":"Улица Берлина ночью","caption":"Kirchner - Улица"}]},{"slug":"bauhaus","de":"BAUHAUS","ru":"БАУХАУС","tb":"<p>Немецкая школа искусства, дизайна и архитектуры, основанная в Веймаре в 1919 году Вальтером Гропиусом. Баухаус — это про функциональность, ясность и универсальность. Это не только стиль, но и философия: «форма следует за функцией».</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Простые геометрические формы.</strong> Квадраты, круги, треугольники, прямые линии — ничего лишнего.</li> <li><strong>Минимализм и чистота композиции.</strong> Композиция строится на сетке, балансе и ритме.</li> <li><strong>Типографика как инструмент.</strong> Чёткие шрифты без засечек, крупные заголовки, выравнивание по левому краю, иерархия текста.</li> <li><strong>Ограниченная палитра.</strong> Часто используют основные цвета (красный, синий, жёлтый) плюс чёрный и белый.</li> <li><strong>Материалы и конструкция на виду.</strong> Металл, стекло, бетон, открытые стыки — честность материалов и сборки.</li> </ul> <p><em>Примеры настроений: «порядок, который работает», «чистая логика пространства», «дизайн для всех».</em></p>","artists":["Вальтер Гропиус (Walter Gropius)","Пауль Клее (Paul Klee)","Василий Кандинский (Wassily Kandinsky)"],"works":[{"src":"House.JPG","alt":"Здание Баухауса в Дессау","caption":"Gropius - Здание Баухауса в Дессау"},{"src":"Vassily.jpg","alt":"Композиция VIII","caption":"Kandinsky - Komposition VIII"}]},{"slug":"gotik","de":"GOTIK","ru":"ГОТИКА","tb":"<p>Художественный стиль, господствовавший в Западной Европе с XII по XV век. Готика — это про устремление вверх: к свету, к небу, к Богу. Соборы становятся главным произведением эпохи, а живопись и скульптура подчиняются архитектуре.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Вертикаль и стрельчатые арки.</strong> Всё тянется ввысь — своды, окна, шпили.</li> <li><strong>Витражи.</strong> Цветной свет становится частью образа; синий, красный и золотой задают настроение.</li> <li><strong>Условность и символизм.</strong> Пропорции не реалистичны, а подчинены иерархии смыслов.</li> <li><strong>Детализация и орнамент.</strong> Каменная резьба, миниатюры в рукописях, узоры — везде.</li> </ul> <p><em>Примеры настроений: «свет сквозь цветное стекло», «тишина под сводами», «всё тянется к небу».</em></p>","artists":["Джотто ди Бондоне (Giotto di Bondone)","Симоне Мартини (Simone Martini)","Братья Лимбург (Limbourg brothers)"],"works":[{"src":"giotto.jpg","alt":"Оплакивание Христа","caption":"Giotto - Оплакивание Христа"},{"src":"martini.jpg","alt":"Благовещение","caption":"Martini - Благовещение"}]},{"slug":"romantik","de":"ROMANTIK","ru":"РОМАНТИЗМ","tb":"<p>Идейно-художественное движение конца XVIII — первой половины XIX века. Романтизм — это про чувство, воображение и субъективный взгляд. Художник противопоставляет холодной рассудочности страсть, природу — городу, личность — толпе.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Культ чувства.</strong> Эмоция, а не разум, движет сюжетом; в центре — переживание.</li> <li><strong>Возвышенное и ужасное.</strong> Бури, обрывы, руины, туманы — природа как стихия.</li> <li><strong>Индивидуализм.</strong> Одинокая фигура на фоне огромного мира — частый мотив.</li> <li><strong>Свет и цвет.</strong> Драматические контрасты, тёплые и холодные вспышки, «эффект театра».</li> </ul> <p><em>Примеры настроений: «человек и бездна», «буря над морем», «тишина руин».</em></p>","artists":["Каспар Давид Фридрих (Caspar David Friedrich)","Уильям Тёрнер (William Turner)","Эжен Делакруа (Eugène Delacroix)"],"works":[{"src":"friedrich.jpg","alt":"Странник над морем тумана","caption":"Friedrich - Странник над морем тумана"},{"src":"turner.jpg","alt":"Дождь, пар и скорость","caption":"Turner - Дождь, пар и скорость"}]},{"slug":"realismus","de":"REALISMUS","ru":"РЕАЛИЗМ","tb":"<p>Направление в искусстве середины XIX века, пришедшее на смену романтизму. Реализм — это про правду без прикрас: повседневный труд, обычные люди, социальные контрасты. Художник перестаёт идеализировать и начинает свидетельствовать.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Быт и труд.</strong> Крестьяне, рабочие, мастерские, кухни — сцены, которых раньше не было в «высоком» искусстве.</li> <li><strong>Социальный взгляд.</strong> Картина как документ эпохи, часто с критическим подтекстом.</li> <li><strong>Точность деталей.</strong> Костюм, интерьер, свет — всё выписано с достоверностью.</li> <li><strong>Сдержанная палитра.</strong> Землистые, натуральные тона вместо романтических эффектов.</li> </ul> <p><em>Примеры настроений: «тяжёлый день на поле», «город, каким он был», «правда без романтики».</em></p>","artists":["Гюстав Курбе (Gustave Courbet)","Жан-Франсуа Милле (Jean-François Millet)","Илья Репин (Ilya Repin)"],"works":[{"src":"courbet.jpg","alt":"Похороны в Орнане","caption":"Courbet - Похороны в Орнане"},{"src":"repin.jpg","alt":"Бурлаки на Волге","caption":"Repin - Бурлаки на Волге"}]},{"slug":"futurismus","de":"FUTURISMUS","ru":"ФУТУРИЗМ","tb":"<p>Авангардное движение, зародившееся в Италии в 1909 году. Футуризм — это культ скорости, техники и движения. Художники отказываются от прошлого и воспевают машину, город, войну как «гигиену мира».</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Динамика.</strong> Предмет не «стоит», а «движется»: фигуры разложены на фазы, как в кино.</li> <li><strong>Силовые линии.</strong> Полосы и лучи, пронизывающие пространство, показывают энергию.</li> <li><strong>Яркая палитра.</strong> Контрастные цвета, свет, электричество.</li> <li><strong>Техника и город.</strong> Поезда, автомобили, самолёты, заводы — новая мифология.</li> </ul> <p><em>Примеры настроений: «скорость как новая красота», «город в движении», «всё одновременно и сразу».</em></p>","artists":["Умберто Боччони (Umberto Boccioni)","Джакомо Балла (Giacomo Balla)","Джино Северини (Gino Severini)"],"works":[{"src":"boccioni.jpg","alt":"Уникальные формы непрерывности в пространстве","caption":"Boccioni - Уникальные формы непрерывности…"},{"src":"balla.jpg","alt":"Динамизм собаки на поводке","caption":"Balla - Динамизм собаки на поводке"}]},{"slug":"konzeptualismus","de":"KONZEPTUALISMUS","ru":"КОНЦЕПТУАЛИЗМ","tb":"<p>Направление, оформившееся в 1960-х годах. Концептуализм — это про идею, а не про объект. Художник отказывается от живописи и скульптуры в пользу текста, инструкции, документа, жеста. Главное — мысль, которую произведение запускает.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Идея важнее формы.</strong> Работа может выглядеть как записка, схема, фотография или ничего не выглядеть.</li> <li><strong>Язык как материал.</strong> Текст, определение, инструкция — полноценные художественные средства.</li> <li><strong>Документация вместо объекта.</strong> Часто остаётся только описание или след акции.</li> <li><strong>Критика институций.</strong> Вопрос «что такое искусство?» — часть самой работы.</li> </ul> <p><em>Примеры настроений: «искусство как вопрос», «идея, которую нельзя повесить на стену», «зритель как соавтор».</em></p>","artists":["Марсель Дюшан (Marcel Duchamp)","Джозеф Кошут (Joseph Kosuth)","Сол Левитт (Sol LeWitt)"],"works":[{"src":"duchamp.jpg","alt":"Фонтан","caption":"Duchamp - Фонтан"},{"src":"kosuth.jpg","alt":"One and Three Chairs","caption":"Kosuth - One and Three Chairs"}]},{"slug":"minimalismus","de":"MINIMALISMUS","ru":"МИНИМАЛИЗМ","tb":"<p>Направление в искусстве, оформившееся в США в 1960-х годах. Минимализм — это про сокращение до сути: ничего лишнего, ни одной «декоративной» детали. Форма, материал и пространство говорят сами за себя.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Простые геометрические формы.</strong> Куб, прямоугольник, линия — базовые элементы.</li> <li><strong>Индустриальные материалы.</strong> Металл, фанера, флуоресцентные лампы, бетон, плексиглас.</li> <li><strong>Серийность и повтор.</strong> Одинаковые модули, выстроенные в ряд или сетку.</li> <li><strong>Отказ от иллюзии.</strong> Никакой «картины внутри картины» — объект есть то, что он есть.</li> </ul> <p><em>Примеры настроений: «ничего лишнего», «объект в комнате», «тишина формы».</em></p>","artists":["Дональд Джадд (Donald Judd)","Дэн Флавин (Dan Flavin)","Фрэнк Стелла (Frank Stella)"],"works":[{"src":"judd.jpg","alt":"Untitled (Stack)","caption":"Judd - Untitled (Stack)"},{"src":"flavin.jpg","alt":"Untitled (to Donna)","caption":"Flavin - Untitled (to Donna)"}]},{"slug":"popart","de":"POP-ART","ru":"ПОП-АРТ","tb":"<p>Направление, возникшее в США и Великобритании в 1950–1960-х годах. Поп-арт — это искусство, которое берёт образы массовой культуры: рекламу, комиксы, консервные банки, звёзд. Художник стирает границу между «высоким» и «популярным».</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Образы массовой культуры.</strong> Банки супа, комиксы, портреты звёзд, реклама — всё становится материалом.</li> <li><strong>Яркие, «плоские» цвета.</strong> Чёткие контуры, растушёвка, имитация печати.</li> <li><strong>Серийность и тираж.</strong> Шелкография, повтор, тираж — как в промышленности.</li> <li><strong>Ирония.</strong> Серьёзное и банальное уравнены; искусство улыбается, но не без подтекста.</li> </ul> <p><em>Примеры настроений: «искусство с полки супермаркета», «звезда как продукт», «серьёзно о несерьёзном».</em></p>","artists":["Энди Уорхол (Andy Warhol)","Рой Лихтенштейн (Roy Lichtenstein)","Ричард Хэмилтон (Richard Hamilton)"],"works":[{"src":"warhol.jpg","alt":"Campbell's Soup Cans","caption":"Warhol - Campbell's Soup Cans"},{"src":"lichtenstein.jpg","alt":"Whaam!","caption":"Lichtenstein - Whaam!"}]},{"slug":"digitalekunst","de":"DIGITALE KUNST","ru":"ЦИФРОВОЕ ИСКУССТВО","tb":"<p>Область современного искусства, где инструментом становится компьютер, код, алгоритм или нейросеть. Цифровое искусство — это не «стиль», а среда: экран, данные, интерактив, виртуальная и дополненная реальность.</p> <p><strong>Характерные черты:</strong></p> <ul> <li><strong>Технология как материал.</strong> Код, пиксель, 3D, генеративные алгоритмы — не «инструмент», а сам медиум.</li> <li><strong>Интерактив и иммерсия.</strong> Зритель становится участником: свет реагирует на движение, изображение — на данные.</li> <li><strong>Данные как эстетика.</strong> Потоки информации, звук, биометрия превращаются в визуальный образ.</li> <li><strong>Новые формы собственности.</strong> NFT, цифровые копии, вопросы авторства и подлинности.</li> </ul> <p><em>Примеры настроений: «данные, ставшие светом», «картина, которая смотрит на тебя», «искусство без оригинала».</em></p>","artists":["Рефика Анадол (Refik Anadol)","Beeple / Майк Винкельман (Mike Winkelmann)","TeamLab"],"works":[{"src":"klingemann.jpg","alt":"Machine Hallucinations","caption":"Klingemann - Memories of Passersby I"},{"src":"beeple.jpg","alt":"Everydays: The First 5000 Days","caption":"Beeple - Everydays: The First 5000 Days"}]}];

var PROMPT = 'root@kunstsystem:~$';
var screen = document.getElementById('screen');
var winTitle = document.getElementById('win-title');
var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function dual(de, ru, cls) {
    return '<div class="term-dual ' + (cls || '') + '">' +
        '<span class="lang-de">' + esc(de) + '</span>' +
        '<span class="lang-ru">' + esc(ru) + '</span></div>';
}

function cliHtml() {
    return '<div class="command-line"><span class="prompt">' + PROMPT +
        '</span><input type="text" id="cmd-input" class="cmd-input" autocomplete="off" spellcheck="false" aria-label="Командная строка" placeholder="введите hilfe..."></div>';
}

function renderIndex() {
    winTitle.textContent = 'kunst_system.exe [Hauptmenü]';
    var html = '<div class="command-line"><span class="prompt">' + PROMPT + '</span> <span style="color:#27c93f">whoami</span></div>';
    html += dual('SPRACHROHR DER KUNST', 'РУПОР ИСКУССТВА', 'title-dual');
    html += dual('Interaktives Verzeichnis der Bildstile', 'Интерактивный справочник изобразительных стилей', 'desc-dual');
    html += dual(PROMPT + ' ls ./stile', PROMPT + ' показать стили', 'green-command');
    html += '<ul class="style-list">';
    DATA.forEach(function (s, i) {
        var n = i < 9 ? '0' + (i + 1) : String(i + 1);
        html += '<li><a class="term-dual list-item" data-slug="' + s.slug + '">' +
            '<span class="lang-de">[' + n + '] ' + esc(s.de) + '</span>' +
            '<span class="lang-ru">[' + n + '] ' + esc(s.ru) + '</span></a></li>';
    });
    html += '</ul>';
    html += dual('Sys: System bereit. Wählen Sie einen Stil aus.', 'Sys: Система готова. Выберите стиль.', 'status-dual');
    html += cliHtml();
    screen.innerHTML = html;
    reveal();
    bindScreen();
}

function renderStyle(slug) {
    var s = null;
    DATA.forEach(function (x) { if (x.slug === slug) s = x; });
    if (!s) { renderIndex(); return; }
    winTitle.textContent = 'kunst_system.exe [' + s.de + ']';
    var html = '<a class="simple-link" data-nav="index"><span class="prompt">' + PROMPT + '</span> вернуться в главное меню</a>';
    html += dual(s.de, s.ru, 'title-dual');
    html += dual(PROMPT + ' cat beschreibung.txt', PROMPT + ' прочитать описание', 'green-command');
    html += '<div class="text-block">' + s.tb + '</div>';
    html += dual(PROMPT + ' ls ./künstler', PROMPT + ' список художников', 'green-command');
    html += '<ul class="style-list">';
    s.artists.forEach(function (a) { html += '<li>- ' + esc(a) + '</li>'; });
    html += '</ul>';
    html += dual(PROMPT + ' display ./beispiele', PROMPT + ' показать примеры работ', 'green-command');
    html += '<div class="image-grid">';
    s.works.forEach(function (w) {
        html += '<div class="image-card">' +
            '<img class="art-image" src="https://deutschesterminal-design.netlify.app/img/' + esc(w.src) + '" alt="' + esc(w.alt) + '" ' +
            'onerror="this.outerHTML=\'<div class=&quot;img-placeholder&quot;>[ signal fehlt ]<br>' + esc(w.src) + '</div>\'">' +
            '<span class="image-caption">' + esc(w.caption) + '</span></div>';
    });
    html += '</div><br><br>';
    html += cliHtml();
    screen.innerHTML = html;
    reveal();
    bindScreen();
}

function reveal() {
    if (reducedMotion) return;
    Array.prototype.forEach.call(screen.children, function (el, i) {
        el.classList.add('reveal');
        el.style.animationDelay = (i * 60) + 'ms';
    });
}

function bindScreen() {
    Array.prototype.forEach.call(screen.querySelectorAll('[data-slug]'), function (a) {
        a.addEventListener('click', function () { location.hash = a.getAttribute('data-slug'); });
    });
    Array.prototype.forEach.call(screen.querySelectorAll('[data-nav="index"]'), function (a) {
        a.addEventListener('click', function () { location.hash = ''; });
    });
    bindCli();
}

function route() {
    var slug = location.hash.replace('#', '');
    if (slug) renderStyle(slug); else renderIndex();
}
window.addEventListener('hashchange', route);

function findStyle(query) {
    var norm = function (s) {
        return s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
            .replace(/ß/g, 'ss').replace(/[\s\-_]/g, '');
    };
    var q = norm(query);
    var idx = parseInt(q, 10);
    return DATA.filter(function (s, i) {
        var n = i < 9 ? '0' + (i + 1) : String(i + 1);
        return n === q || norm(s.slug) === q || norm(s.de) === q || norm(s.ru) === q ||
            (!isNaN(idx) && idx === i + 1);
    })[0];
}

function print(text, cls) {
    var line = document.getElementById('cmd-input').closest('.command-line');
    var div = document.createElement('div');
    div.className = 'cmd-output' + (cls ? ' ' + cls : '');
    div.textContent = text;
    screen.insertBefore(div, line);
    div.scrollIntoView({ block: 'nearest', behavior: reducedMotion ? 'auto' : 'smooth' });
}

function showHelp() {
    print('доступные команды:', 'cmd-muted');
    print('  ls                    — список стилей');
    print('  open <номер/имя>      — открыть стиль (напр. open 13)');
    print('  cat beschreibung.txt  — описание (в начало страницы)');
    print('  index | menu          — главное меню');
    print('  whoami | date | clear | hilfe');
}

var COMMANDS = {
    hilfe: showHelp, help: showHelp, '?': showHelp,
    ls: function () {
        DATA.forEach(function (s, i) {
            var n = i < 9 ? '0' + (i + 1) : String(i + 1);
            print('[' + n + '] ' + s.de + ' / ' + s.ru);
        });
    },
    open: function (args) {
        if (!args.length) { print('использование: open <номер или название>', 'cmd-muted'); return; }
        var s = findStyle(args.join(' '));
        if (s) { print('открываю ' + s.de + ' / ' + s.ru + ' ...', 'cmd-muted'); setTimeout(function () { location.hash = s.slug; }, 350); }
        else print('стиль не найден: ' + args.join(' ') + '. введите ls', 'cmd-error');
    },
    cat: function (args) {
        var t = args.join(' ');
        if (t === 'beschreibung.txt' || t === 'beschreibung') {
            window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
            print('beschreibung.txt — описание в начале страницы', 'cmd-muted');
        } else print('cat: ' + (t || '?') + ': файл не найден', 'cmd-error');
    },
    index: function () { location.hash = ''; },
    menu: function () { location.hash = ''; },
    whoami: function () { print('kunst-gast — гость справочника «Рупор искусства»', 'cmd-muted'); },
    date: function () { print(new Date().toLocaleString('ru-RU'), 'cmd-muted'); },
    clear: function () {
        Array.prototype.forEach.call(screen.querySelectorAll('.cmd-output'), function (el) { el.remove(); });
    }
};

function bindCli() {
    var input = document.getElementById('cmd-input');
    input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var raw = input.value.trim();
        input.value = '';
        if (!raw) return;
        print(PROMPT + ' ' + raw, 'cmd-echo');
        var parts = raw.split(/\s+/);
        var cmd = parts[0].toLowerCase();
        if (COMMANDS[cmd]) COMMANDS[cmd](parts.slice(1));
        else print('bash: ' + cmd + ': команда не найдена. введите hilfe', 'cmd-error');
    });
    screen.addEventListener('click', function (e) {
        if (window.getSelection().toString()) return;
        if (e.target.closest('a')) return;
        input.focus();
    });
}

route();
</script>
</body>
</html>
